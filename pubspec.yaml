name: fixtrail
description: FixTrail - campus incident reporting app for ALU students and staff.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  provider: ^6.1.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  timeago: ^3.7.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
